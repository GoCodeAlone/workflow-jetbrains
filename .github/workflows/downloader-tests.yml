name: Downloader recovery tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/kotlin/com/gocodalone/workflow/ide/BinaryDownloader.kt'
      - 'src/main/kotlin/com/gocodalone/workflow/ide/BinaryFileDownloader.kt'
      - 'src/test/kotlin/com/gocodalone/workflow/ide/BinaryFileDownloaderTest.kt'
      - 'ci/downloader-tests/**'
      - '.github/workflows/downloader-tests.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/kotlin/com/gocodalone/workflow/ide/BinaryDownloader.kt'
      - 'src/main/kotlin/com/gocodalone/workflow/ide/BinaryFileDownloader.kt'
      - 'src/test/kotlin/com/gocodalone/workflow/ide/BinaryFileDownloaderTest.kt'
      - 'ci/downloader-tests/**'
      - '.github/workflows/downloader-tests.yml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  downloader-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run downloader recovery tests
        shell: pwsh
        run: |
          .\gradlew.bat --project-dir ci/downloader-tests test --no-daemon --max-workers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = 'ci/downloader-tests/build/test-results/test/TEST-com.gocodalone.workflow.ide.BinaryFileDownloaderTest.xml'
          if (-not (Test-Path $report)) { throw 'Downloader regression report is missing' }
          [xml]$results = Get-Content -Raw $report
          if ([int]$results.testsuite.tests -lt 1) { throw 'No downloader regression tests ran' }
          if ([int]$results.testsuite.skipped -ne 0) { throw 'Downloader regression tests were skipped' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloader-tests-windows
          path: ci/downloader-tests/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
